name: Compilar My LOOI APK (Español)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Compilación APK Android Release
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 1. Descargar repositorio
        uses: actions/checkout@v4

      - name: 2. Restaurar módulos originales y aplicar interfaz en español
        run: |
          git clone --depth 1 https://github.com/razor79/my-looi.git /tmp/upstream-looi
          for dir in /tmp/upstream-looi/src/*/; do
            name=$(basename "$dir")
            if [ "$name" != "i18n" ]; then
              rm -rf "src/$name"
              cp -r "$dir" src/
            fi
          done
          rm -rf /tmp/upstream-looi

      - name: 3. Configurar Java 17 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: 4. Aceptar licencias del Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: 5. Instalar pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.34.5

      - name: 6. Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: 7. Instalar dependencias del proyecto
        run: |
          corepack enable
          corepack pnpm install --frozen-lockfile

      - name: 8. Generar Keystore de firma Release
        run: |
          mkdir -p "$HOME/.config/my-looi/signing"
          KEYSTORE_PATH="$HOME/.config/my-looi/signing/my-looi-release.keystore"
          
          keytool -genkey -v \
            -keystore "$KEYSTORE_PATH" \
            -alias my-looi-release \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "MyLooiPassword2026" \
            -keypass "MyLooiPassword2026" \
            -dname "CN=My Looi Robot, OU=Community, O=Looi, L=Madrid, ST=Madrid, C=ES"

          cat << EOF > "$HOME/.config/my-looi/signing/release.env"
          MY_LOOI_RELEASE_KEYSTORE=$KEYSTORE_PATH
          MY_LOOI_RELEASE_STORE_PASSWORD=MyLooiPassword2026
          MY_LOOI_RELEASE_KEY_ALIAS=my-looi-release
          MY_LOOI_RELEASE_KEY_PASSWORD=MyLooiPassword2026
          EOF
          chmod 600 "$HOME/.config/my-looi/signing/release.env"

          echo "MY_LOOI_RELEASE_KEYSTORE=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "MY_LOOI_RELEASE_STORE_PASSWORD=MyLooiPassword2026" >> "$GITHUB_ENV"
          echo "MY_LOOI_RELEASE_KEY_ALIAS=my-looi-release" >> "$GITHUB_ENV"
          echo "MY_LOOI_RELEASE_KEY_PASSWORD=MyLooiPassword2026" >> "$GITHUB_ENV"

      - name: 9. Ejecutar compilación oficial de Android APK
        run: |
          chmod +x scripts/*.sh || true
          bash scripts/build-android-apk.sh

      - name: 10. Subir APK terminado como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: My-LOOI-v2.1-Espanol-APK
          path: |
            output/android/*.apk
            android/app/build/outputs/apk/release/*.apk
          retention-days: 30
